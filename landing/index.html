      lead: 'P&L en direct, équité et marge restante avant ta perte journalière maximale — en un coup d’œil, sans ouvrir MetaTrader 5. Pensé pour les traders de prop firms.',
      cta: 'Rejoindre la liste d’attente', cta2: 'Comment ça marche',
      small: 'Accès anticipé gratuit · Sans carte bancaire · Ne passe jamais d’ordre',
      w_ago: 'il y a 1 min', w_room: 'Perte jour restante', live: 'Session de Londres',
      l_eq: 'Équité', l_dd: 'DD max', notif: '80 % de ta perte journalière maximale atteints',
      pain_k: 'Le problème', pain_h: 'Une mauvaise heure peut te coûter le compte.',
      bad_h: 'Aujourd’hui', bad_l: '<li>Tu ouvres MT5 vingt fois par jour juste pour voir ton P&L</li><li>Tu calcules ton drawdown de tête, sous pression</li><li>Tu apprends que tu as dépassé la limite… par e-mail</li>',
      good_h: 'Avec RiskPeek', good_l: '<li>Tu allumes ton téléphone : P&L et risque restant sont déjà là</li><li>La limite est calculée pour toi, avec les règles de ta prop firm</li><li>Tu es prévenu à 80 %, avant qu’il ne soit trop tard</li>',
      feat_k: 'Fonctions', feat_h: 'Tout ce qu’il faut pour rester dans la course.', feat_s: 'Conçu autour des règles qui font vraiment perdre les comptes financés : la perte journalière et le drawdown maximal.',
      f1_h: 'Jauge de perte journalière', f1_p: 'Ce que tu peux encore perdre aujourd’hui, en argent et en %, avec l’heure de remise à zéro et le mode de calcul de ta firme.',
      f2_h: 'Drawdown maximal', f2_p: 'La distance à ta limite de drawdown global, fixe ou glissante.',
      f3_h: 'Activité en direct', f3_p: 'Ton P&L en temps réel sur l’écran verrouillé et la Dynamic Island pendant ta session.',
      f4_h: 'Alertes', f4_p: 'Une notification à 50 % et 80 % de tes limites, et à la clôture d’une position.',
      f5_h: 'Plusieurs comptes', f5_p: 'Challenge, vérification, compte financé : passe de l’un à l’autre d’un geste.',
      f6_h: 'Lecture seule et privé', f6_p: 'Le connecteur lit seulement les statistiques du compte. Il ne peut ni ouvrir, ni fermer, ni modifier un trade.',
      how_k: 'Comment ça marche', how_h: 'Prêt en 2 minutes.',
      s1_h: 'Ajoute le connecteur à MT5', s1_p: 'Un petit Expert Advisor gratuit sur ton PC ou ton VPS. Il lit les statistiques du compte toutes les quelques secondes — rien d’autre.',
      s2_h: 'Scanne le QR code', s2_p: 'Ouvre l’app et scanne le code affiché par le connecteur. Pas de clé à copier-coller.',
      s3_h: 'Regarde ton écran verrouillé', s3_p: 'Ajoute le widget. Ton P&L et ton risque sont à un coup d’œil, toute la journée.',
      price_k: 'Accès anticipé', price_a: '4,99 €', price_m: ' /mois', price_b: 'Membres fondateurs : −50 % à vie',
      price_l: '<li>Widgets écran verrouillé et écran d’accueil</li><li>Activité en direct pendant tes sessions</li><li>Alertes perte journalière et drawdown</li><li>Jusqu’à 3 comptes</li>',
      price_n: 'Prix prévu — la bêta est gratuite. Inscris-toi pour y avoir accès en premier.',
      faq_k: 'FAQ', faq_h: 'Questions',
      faq: [
        ['Peut-il passer ou fermer des trades ?', 'Non. Le connecteur est en lecture seule : il envoie le solde, l’équité, le P&L et le nombre de positions. Il n’a aucun droit de trading.'],
        ['Mon ordinateur doit-il rester allumé ?', 'MetaTrader 5 doit tourner quelque part avec le connecteur : ton PC, un Mac ou un VPS (la plupart des traders de prop firms en ont déjà un).'],
        ['Quelles prop firms sont compatibles ?', 'Toutes celles qui utilisent MetaTrader 5. Tu règles le % de perte journalière, le drawdown maximal et l’heure de remise à zéro — des réglages tout prêts pour les firmes connues sont prévus.'],
        ['Android ? MT4 ? cTrader ?', 'iPhone et MT5 d’abord. Dis-nous ce que tu utilises en t’inscrivant : c’est ce qui décidera de la suite.'],
        ['Est-ce fait par MetaQuotes ou une prop firm ?', 'Non. RiskPeek est une app indépendante conçue pour fonctionner avec MetaTrader 5.'],
      ],
      final_h: 'Arrête de vérifier. Jette un œil.', final_s: 'Inscris-toi sur la liste d’attente et profite de l’accès anticipé gratuit à l’ouverture de la bêta.',
      legal1: 'MetaTrader est une marque déposée de MetaQuotes Ltd. RiskPeek n’est ni affilié, ni approuvé, ni sponsorisé par MetaQuotes Ltd ou une prop firm.',
      legal2: 'RiskPeek affiche des informations et ne constitue pas un conseil financier. Le trading comporte un risque important de perte.',
      soon: 'La liste d’attente ouvre très bientôt — reviens dans quelques jours !',
    },
  };
  const $ = s => document.querySelector(s);
  let lang = 'en';
  try { lang = localStorage.getItem('rp.lang') || (navigator.language || '').slice(0, 2); } catch {}
  if (!T[lang]) lang = 'en';

  function apply() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(el => {
      const v = t[el.dataset.t]; if (v == null) return;
      if (el.hasAttribute('data-html')) el.innerHTML = v; else el.textContent = v;
    });
    document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
    $('#faq').innerHTML = t.faq.map(([q, a]) => `<details class="reveal in"><summary>${q}</summary><p>${a}</p></details>`).join('');
    $('#lsDate').textContent = new Date().toLocaleDateString(lang === 'fr' ? 'fr-FR' : 'en-US', { weekday: 'long', day: 'numeric', month: 'long' });
    tick(true);
  }
  document.querySelector('.lang').addEventListener('click', e => {
    const b = e.target.closest('[data-l]'); if (!b) return;
    lang = b.dataset.l; try { localStorage.setItem('rp.lang', lang); } catch {}
    apply();
  });

  // Liste d'attente
  function toast(msg) {
    const el = $('#toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 3200);
  }
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-join]'); if (!a) return;
    e.preventDefault();
    if (WAITLIST_URL) window.open(WAITLIST_URL + (WAITLIST_URL.includes('?') ? '&' : '?') + 'lang=' + lang, '_blank', 'noopener');
    else toast(T[lang].soon);
  });

  // Écran verrouillé animé (données fictives)
  const fmt = (n, d = 2) => n.toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  let pnl = 125.4, step = 0;
  function tick(redraw) {
    if (!redraw) { pnl += (Math.random() - .5) * 60; pnl = Math.max(-420, Math.min(380, pnl)); step++; }
    const cur = lang === 'fr' ? ' €' : '';
    const pre = lang === 'fr' ? '' : '$';
    const room = Math.max(0, 500 - Math.max(0, -pnl) - 188);
    const pct = room / 500 * 100;
    $('#wPnl').textContent = (pnl >= 0 ? '+' : '−') + pre + fmt(Math.abs(pnl)) + cur;
    $('#wPnl').style.color = pnl >= 0 ? 'var(--green)' : 'var(--red)';
    $('#wRoom').textContent = `${pre}${fmt(room, 0)}${cur} / ${pre}500${cur}`;
    $('#wGauge').style.width = pct + '%';
    $('#wGauge').style.background = pct < 25 ? 'var(--red)' : pct < 45 ? 'var(--amber)' : 'var(--green)';
    $('#lPnl').textContent = (pnl >= 0 ? '+' : '−') + fmt(Math.abs(pnl), 0);
    $('#lPnl').style.color = pnl >= 0 ? 'var(--green)' : 'var(--red)';
    $('#lEq').textContent = fmt(100000 + pnl, 0);
    $('#lDd').textContent = fmt(3.8 - pnl / 1000, 1) + '%';
    $('#notif').classList.toggle('show', pct < 25 || step % 6 === 5);
    const d = new Date();
    $('#lsTime').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(() => tick(false), 2200);

  // Apparition au défilement
  const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
  }), { threshold: .15 }) : null;
  apply();
  document.querySelectorAll('.reveal').forEach(el => io ? io.observe(el) : el.classList.add('in'));
})();
</script>
</body>
</html>
